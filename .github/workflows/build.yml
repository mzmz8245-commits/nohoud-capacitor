name: Build Capacitor iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install Capacitor CLI & Dependencies
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare Web Assets Directory (dist)
        run: |
          mkdir -p dist
          cp -R * dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/ios dist/android

      - name: Force Add & Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Find Workspace and Build iOS App (.app)
        run: |
          # البحث التلقائي عن ملف الـ workspace وبناءه مباشرة
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -type d | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "Error: App.xcworkspace not found!"
            exit 1
          fi
          echo "Found workspace at: $WORKSPACE_PATH"
          
          xcodebuild -workspace "$WORKSPACE_PATH" \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build

      - name: Zip iOS Simulator App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r nohoud-ios-app.zip App.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nohoud-ios-simulator-${{ github.run_number }}
          path: build/Build/Products/Release-iphonesimulator/nohoud-ios-app.zip

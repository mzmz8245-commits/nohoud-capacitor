name: Build Capacitor iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install Dependencies
        run: |
          npm install

      - name: Install Capacitor CLI Globally & Locally
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/ios

      - name: Build Web Assets
        run: |
          mkdir -p dist
          cp -R * dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/workflow dist/ios dist/android

      - name: Add iOS Platform Cleanly
        run: |
          npx cap rm ios || true
          npx cap add ios
          npx cap sync ios

      - name: Verify Workspace Exists
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "Error: ios/App/App.xcworkspace still missing!"
            exit 1
          fi

      - name: Build iOS App (.app)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Zip iOS Simulator App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r nohoud-ios-app.zip App.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nohoud-ios-simulator-${{ github.run_number }}
          path: build/Build/Products/Release-iphonesimulator/nohoud-ios-app.zip

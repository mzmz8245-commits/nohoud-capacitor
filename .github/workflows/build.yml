name: Build Capacitor iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_SCHEME: App
  APP_WORKSPACE: ios/App/App.xcworkspace

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install Capacitor CLI & Dependencies
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare Web Assets Directory (dist)
        run: |
          mkdir -p dist
          cp -R * dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/ios dist/android

      - name: Create and sync the native iOS project
        run: |
          # تنظيف أي مجلد قديم
          rm -rf ios

          # توليد ومزامنة مشروع iOS
          npx cap add ios
          npx cap sync ios

          # التحقق من وجود وملفات مشروع Xcode
          test -d ios/App/App.xcworkspace
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
          test -f ios/App/App.xcodeproj/project.pbxproj

          echo "Generated native project:"
          ls -la ios/App

      - name: Build iOS App (.app)
        run: |
          xcodebuild -workspace "$APP_WORKSPACE" \
                     -scheme "$APP_SCHEME" \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build

      - name: Zip iOS Simulator App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r nohoud-ios-app.zip App.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nohoud-ios-simulator-${{ github.run_number }}
          path: build/Build/Products/Release-iphonesimulator/nohoud-ios-app.zip

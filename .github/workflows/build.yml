name: Build Capacitor iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install Capacitor CLI & Dependencies
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/ios @capacitor/geolocation @capacitor/local-notifications

      - name: Prepare Web Assets Directory (dist)
        run: |
          mkdir -p dist
          cp -R * dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/ios dist/android

      - name: Create and sync iOS
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build iOS App (.app)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Zip iOS Simulator App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r nohoud-ios-app.zip App.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nohoud-ios-simulator-${{ github.run_number }}
          path: build/Build/Products/Release-iphonesimulator/nohoud-ios-app.zip

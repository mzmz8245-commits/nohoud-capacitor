name: Deploy to GitHub Pages and Capgo OTA

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Get Version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          echo "version=${VERSION}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload OTA bundle to Capgo
        run: |
          npx @capgo/cli@latest bundle upload app.nohoud.mobile --bundle ${{ steps.package-version.outputs.version }} --channel production --path .
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
